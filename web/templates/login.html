
{% extends "auth_base.html" %}

{% block auth_content %}
<div class="form-heading">
    <span class="form-eyebrow">CHÀO MỪNG TRỞ LẠI</span>
    <h2>Đăng nhập</h2>
    <p>Đăng nhập để quản lý tủ thuốc của bạn.</p>
</div>

<form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <div class="form-group">
        <label for="email">Địa chỉ email</label>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com"
               value="{{ request.form.get('email', '') }}"
               autocomplete="email" maxlength="190" required>
    </div>

    <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password"
               placeholder="Nhập mật khẩu"
               autocomplete="current-password" required>
    </div>

    <button type="submit" class="auth-submit">
        Đăng nhập
    </button>
</form>

<p class="auth-switch">
    Chưa có tài khoản?
    <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
</p>

<div class="auth-note">
    Tài khoản được sử dụng để quản lý thuốc, lịch nhắc
    và thiết bị của riêng bạn.
</div>
{% endblock %}
