
{% extends "auth_base.html" %}

{% block auth_content %}
<div class="form-heading">
    <span class="form-eyebrow">TẠO TÀI KHOẢN MỚI</span>
    <h2>Đăng ký</h2>
    <p>Bắt đầu quản lý thuốc cùng SmartMed.</p>
</div>

<form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <label for="full_name">Họ và tên</label>
        <input type="text" id="full_name" name="full_name"
               placeholder="Nhập họ và tên"
               value="{{ request.form.get('full_name', '') }}"
               autocomplete="name" maxlength="150" required>
    </div>

    <div class="form-group">
        <label for="email">Địa chỉ email</label>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com"
               value="{{ request.form.get('email', '') }}"
               autocomplete="email" maxlength="190" required>
    </div>

    <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password"
               placeholder="Tối thiểu 8 ký tự"
               autocomplete="new-password"
               minlength="8" maxlength="128" required>
        <small>Sử dụng mật khẩu riêng, khó đoán.</small>
    </div>

    <div class="form-group">
        <label for="confirm_password">Xác nhận mật khẩu</label>
        <input type="password" id="confirm_password"
               name="confirm_password"
               placeholder="Nhập lại mật khẩu"
               autocomplete="new-password"
               minlength="8" maxlength="128" required>
    </div>

    <button type="submit" class="auth-submit">
        Tạo tài khoản
    </button>
</form>

<p class="auth-switch">
    Đã có tài khoản?
    <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
</p>
{% endblock %}
